{% extends 'base.html' %}
{% block content %}

<div class="max-w-7xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-semibold text-gray-800">Products</h1>
            <p class="text-sm text-gray-500 mt-1">Manage your product catalog ({{ products|length }} items)</p>
        </div>
        <div class="flex items-center gap-3">
            <a href="{{ url_for('product.add_product') }}" class="inline-flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700">
                <i class="fas fa-plus"></i> Add Product
            </a>
        </div>
    </div>

    <div class="bg-white shadow-sm rounded-lg overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Price</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Stock</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y">
                    {% for product in products %}
                    <tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800">{{ product.name }}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">₹{{ product.price }}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{{ product.stock }}</td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" class="px-6 py-8 text-center text-sm text-gray-500">No products found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</div>

{% endblock %}
