{% extends 'base.html' %}
{% block title %}Add Product{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow">
    <h2 class="text-2xl font-semibold mb-4">Add Product</h2>

    <form method="POST" action="{{ url_for('product.add_product') }}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
            <input name="name" placeholder="Product name" required class="w-full border-gray-200 rounded px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Price</label>
                <input name="price" type="number" step="0.01" placeholder="0.00" required class="w-full border-gray-200 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Stock</label>
                <input name="stock" type="number" placeholder="0" required class="w-full border-gray-200 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500" />
            </div>
        </div>

        <div class="flex items-center gap-3 mt-4">
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Add Product</button>
            <a href="{{ url_for('product.index') }}" class="text-gray-600 hover:underline">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
