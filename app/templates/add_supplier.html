{% extends 'base.html' %}
{% block title %}Add Supplier{% endblock %}
{% block content %}

<div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow">
    <h2 class="text-2xl font-semibold mb-4">Add Supplier</h2>

    <form method="POST" action="{{ url_for('supplier.add_supplier') }}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
            <input name="name" placeholder="Supplier name" required class="w-full border-gray-200 rounded px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contact Person</label>
            <input name="contact_person" placeholder="Contact person" class="w-full border-gray-200 rounded px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                <input name="phone" placeholder="Phone number" class="w-full border-gray-200 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input name="email" type="email" placeholder="email@example.com" class="w-full border-gray-200 rounded px-3 py-2 focus:ring-2 focus:ring-indigo-500" />
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
            <textarea name="address" rows="3" placeholder="Supplier address" class="w-full border-gray-200 rounded px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <div class="flex items-center gap-3 mt-4">
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Add Supplier</button>
            <a href="{{ url_for('supplier.index') }}" class="text-gray-600 hover:underline">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
