{% extends 'base.html' %}
{% block content %}
<div class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold text-center mb-6">Login to StoreVault</h2>
        <form method="POST">
            <input type="email" name="email" placeholder="Email" class="w-full p-3 border rounded mb-4" required>
            <input type="password" name="password" placeholder="Password" class="w-full p-3 border rounded mb-6" required>
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded hover:bg-blue-700">
                Login
            </button>
        </form>
        <p class="text-center mt-4">
            Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-blue-600">Register</a>
        </p>
    </div>
</div>
{% endblock %}
