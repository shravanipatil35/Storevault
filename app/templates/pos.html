{% extends 'base.html' %}
{% block content %}
<div class="p-8">
    <h1 class="text-3xl font-bold mb-8">Point of Sale (POS)</h1>
    
    <div class="grid grid-cols-2 gap-8">
        <!-- Products List -->
        <div>
            <h2 class="text-xl font-semibold mb-4">Products</h2>
            <input type="text" id="search" placeholder="Search products..." 
                   class="w-full p-3 border rounded mb-4">
            <div id="product-list" class="max-h-96 overflow-auto border rounded p-4">
                <!-- Products will load here via JS later -->
                <p class="text-gray-500">Loading products...</p>
            </div>
        </div>

        <!-- Cart -->
        <div>
            <h2 class="text-xl font-semibold mb-4">Cart</h2>
            <div id="cart" class="border rounded p-4 min-h-64 mb-4">
                <p class="text-gray-500">Cart is empty</p>
            </div>
            <div class="text-right">
                <h3 class="text-2xl font-bold">Total: ₹<span id="total">0</span></h3>
                <button onclick="checkout()" 
                        class="mt-4 bg-green-600 text-white px-8 py-3 rounded text-lg">
                    Complete Sale
                </button>
            </div>
        </div>
    </div>
</div>
<script>
    const productsUrl = "{{ url_for('sale.api_products') }}";
    const checkoutUrl = "{{ url_for('sale.checkout') }}";
    const productList = document.getElementById('product-list');
    const searchInput = document.getElementById('search');
    const cartEl = document.getElementById('cart');
    const totalEl = document.getElementById('total');
    const productsById = new Map();
    const cart = new Map();
    let searchTimer;

    function money(value) {
        return Number(value).toFixed(2);
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    async function loadProducts() {
        const query = searchInput.value.trim();
        const url = query ? `${productsUrl}?search=${encodeURIComponent(query)}` : productsUrl;
        productList.innerHTML = '<p class="text-gray-500">Loading products...</p>';

        try {
            const response = await fetch(url);
            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || 'Unable to load products.');
            }

            productsById.clear();
            data.products.forEach(product => productsById.set(product.id, product));
            renderProducts(data.products);
        } catch (error) {
            productList.innerHTML = `<p class="text-red-500">${escapeHtml(error.message)}</p>`;
        }
    }

    function renderProducts(products) {
        if (!products.length) {
            productList.innerHTML = '<p class="text-gray-500">No products found.</p>';
            return;
        }

        productList.innerHTML = products.map(product => {
            const disabled = product.stock <= 0 ? 'disabled opacity-50 cursor-not-allowed' : '';
            return `
                <div class="flex items-center justify-between border-b py-3 last:border-b-0">
                    <div>
                        <div class="font-semibold">${escapeHtml(product.name)}</div>
                        <div class="text-sm text-gray-500">₹${money(product.price)} | Stock: ${product.stock}</div>
                    </div>
                    <button onclick="addToCart(${product.id})" ${disabled}
                            class="bg-blue-600 text-white px-4 py-2 rounded">
                        Add
                    </button>
                </div>
            `;
        }).join('');
    }

    function addToCart(productId) {
        const product = productsById.get(productId);
        if (!product || product.stock <= 0) {
            return;
        }

        const current = cart.get(productId) || { product, quantity: 0 };
        if (current.quantity >= product.stock) {
            alert('Not enough stock available.');
            return;
        }

        current.quantity += 1;
        cart.set(productId, current);
        renderCart();
    }

    function updateQuantity(productId, quantity) {
        const item = cart.get(productId);
        if (!item) {
            return;
        }

        if (quantity <= 0) {
            cart.delete(productId);
        } else if (quantity <= item.product.stock) {
            item.quantity = quantity;
            cart.set(productId, item);
        } else {
            alert('Not enough stock available.');
        }

        renderCart();
    }

    function renderCart() {
        if (!cart.size) {
            cartEl.innerHTML = '<p class="text-gray-500">Cart is empty</p>';
            totalEl.textContent = '0';
            return;
        }

        let total = 0;
        cartEl.innerHTML = Array.from(cart.values()).map(item => {
            const lineTotal = item.product.price * item.quantity;
            total += lineTotal;
            return `
                <div class="flex items-center justify-between border-b py-3 last:border-b-0">
                    <div>
                        <div class="font-semibold">${escapeHtml(item.product.name)}</div>
                        <div class="text-sm text-gray-500">₹${money(item.product.price)} x ${item.quantity}</div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="updateQuantity(${item.product.id}, ${item.quantity - 1})"
                                class="border px-3 py-1 rounded">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="updateQuantity(${item.product.id}, ${item.quantity + 1})"
                                class="border px-3 py-1 rounded">+</button>
                    </div>
                </div>
            `;
        }).join('');

        totalEl.textContent = money(total);
    }

    async function checkout() {
        if (!cart.size) {
            alert('Cart is empty.');
            return;
        }

        const items = Array.from(cart.values()).map(item => ({
            product_id: item.product.id,
            quantity: item.quantity,
        }));

        try {
            const response = await fetch(checkoutUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ items }),
            });
            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.message || 'Unable to complete sale.');
            }

            cart.clear();
            renderCart();
            await loadProducts();
            alert(data.message);
        } catch (error) {
            alert(error.message);
        }
    }

    searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(loadProducts, 250);
    });

    loadProducts();
</script>
{% endblock %}
