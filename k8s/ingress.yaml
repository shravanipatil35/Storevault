apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storevault-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: storevault-internal-service # Must match your service name
            port:
              number: 80