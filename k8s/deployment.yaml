apiVersion: apps/v1
kind: Deployment
metadata:
  name: storevault-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storevault-app
  template:
    metadata:
      labels:
        app: storevault-app
    spec:
      containers:
      - name: storevault-container
        image: 435240837203.dkr.ecr.ap-south-1.amazonaws.com/storevault:latest
        ports:
        - containerPort: 5000
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: db_password
        - name: DATABASE_URL
          value: "postgresql://storevault_admin:$(DB_PASSWORD)@storevault-production-db.cvo8e82yeor2.ap-south-1.rds.amazonaws.com:5432/storevault"