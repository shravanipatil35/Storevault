apiVersion: apps/v1
kind: Deployment
metadata:
  name: storevault-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storevault-app
  template:
    metadata:
      labels:
        app: storevault-app
    spec:
  containers:
  - name: storevault-container
    image: 435240837203.dkr.ecr.ap-south-1.amazonaws.com/storevault:32
    env:
      - name: SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: db-secrets
            key: SECRET_KEY
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: db-secrets
            key: db_password
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: db-secrets
            key: DATABASE_URL